name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          
          # Two-column wide layout
          config_twocolumns: yes
          
          # Header and basic stats
          base: header, activity, community, repositories, metadata
          
          # Coding habits & time-of-day bar charts
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # 3D Contribution calendar
          plugin_isocalendar: yes
          
          # Programming languages breakdown
          plugin_languages: yes
          plugin_languages_indepth: yes
          
          # Mastered technologies and topics (icon grid)
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars
          plugin_topics_limit: 24
          
          # Music tracks (optional - requires Last.fm or Spotify setup)
          # plugin_music: yes
          # plugin_music_provider: spotify
          # plugin_music_token: ${{ secrets.MUSIC_TOKEN }}
