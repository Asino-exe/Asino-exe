name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          
          # Makes the card 960px wide (two-column layout)
          config_display: large
          
          # Controls the exact order of sections so they balance left & right
          config_order: base.header, base.activity, base.community, base.repositories, habits, isocalendar, languages, topics
          
          # Header and basic stats
          base: header, activity, community, repositories
          
          # Coding habits & bar charts (max days allowed is 30)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # 3D Contribution calendar
          plugin_isocalendar: yes
          
          # Programming languages breakdown
          plugin_languages: yes
          plugin_languages_indepth: yes
          
          # Colorful tech icon grid (requires topics added to your repos)
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 0
